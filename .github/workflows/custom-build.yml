name: Custom Identity Build

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Base name for installed processes, service, paths and TUN'
        type: string
        default: aurora
      app_name:
        description: 'Application display name (empty derives from brand)'
        type: string
        default: ''
      overrides:
        description: 'JSON object of CVR_* identity overrides'
        type: string
        default: '{}'
      platform:
        description: 'Build and verify platform'
        type: choice
        options: [all, linux, windows, macos]
        default: all
      reuse_run:
        description: 'Reuse matching installers from an earlier identity build run'
        type: string
        default: ''
      app_log_level:
        description: 'Application log level during installed verification'
        type: choice
        options: [info, debug]
        default: info
      compare_defaults:
        description: 'Also build and verify unconfigured identity'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-identity-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
          COMPARE_DEFAULTS: ${{ inputs.compare_defaults }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const targets = [
            { platform: 'linux', os: 'ubuntu-22.04', target: 'x86_64-unknown-linux-gnu' },
            { platform: 'windows', os: 'windows-latest', target: 'x86_64-pc-windows-msvc' },
            { platform: 'macos', os: 'macos-latest', target: 'aarch64-apple-darwin' },
          ];
          const selected = targets.filter(x => process.env.SELECTED_PLATFORM === 'all' || x.platform === process.env.SELECTED_PLATFORM);
          const include = selected.flatMap(x => process.env.COMPARE_DEFAULTS === 'true' ? [{ ...x, variant: 'configured' }, { ...x, variant: 'upstream' }] : [{ ...x, variant: 'configured' }]);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          JS

  build:
    name: ${{ matrix.platform }} (${{ matrix.variant }})
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HUSKY: '0'
      CARGO_INCREMENTAL: '0'
      CVR_BUILD_SERVICE_SOURCE: '1'
      RUST_BACKTRACE: short
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: custom-identity-${{ matrix.target }}
          cache-on-failure: true
      - name: Resolve build identity
        shell: bash
        env:
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_OVERRIDES: ${{ inputs.overrides }}
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { buildEnvironment, resolveBuildIdentity } from './scripts/build-identity.mjs';
          const upstream = process.env.BUILD_VARIANT === 'upstream';
          const overrides = upstream ? {} : JSON.parse(process.env.INPUT_OVERRIDES);
          if (!overrides || Array.isArray(overrides) || typeof overrides !== 'object') throw new Error('Overrides must be a JSON object');
          const known = new Set([...Object.keys(resolveBuildIdentity({})).filter(key => key !== 'CVR_CUSTOM_BUILD'), 'CVR_BRAND']);
          for (const [key, value] of Object.entries(overrides)) {
            if (!known.has(key) || typeof value !== 'string') throw new Error(`Unsupported identity override: ${key}`);
          }
          const input = { ...process.env, ...(!upstream && process.env.INPUT_BRAND ? { CVR_BRAND: process.env.INPUT_BRAND } : {}), ...(!upstream && process.env.INPUT_APP_NAME ? { CVR_APP_NAME: process.env.INPUT_APP_NAME } : {}), ...overrides };
          const env = buildEnvironment(input);
          for (const [key, value] of Object.entries(env)) {
            if (key.startsWith('CVR_') || key.startsWith('VITE_CVR_')) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - name: Install Linux build and runtime dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb
      - name: Install dependencies
        shell: bash
        run: |
          npm install --global pnpm@12.11.2
          pnpm install --frozen-lockfile
      - name: Check identity propagation
        shell: bash
        run: |
          pnpm test:identity
          pnpm typecheck
          pnpm test src/utils/branding.test.ts src/services/i18n-branding.test.ts src/services/update.test.ts src/components/layout/notice-manager.test.ts
      - name: Download existing installers
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v7
        with:
          name: custom-identity-${{ matrix.platform }}-${{ matrix.variant }}
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused-installers
      - name: Validate and prepare reused installers
        if: inputs.reuse_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run }}
          REUSE_DIRECTORY: ${{ runner.temp }}/reused-installers
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { resolveBuildIdentity } from './scripts/build-identity.mjs';
          assert.match(process.env.REUSE_RUN_ID, /^\d+$/);
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.REUSE_RUN_ID}`], { encoding: 'utf8' }));
          assert.equal(run.path, '.github/workflows/custom-build.yml');
          assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.match(run.head_sha, /^[0-9a-f]{40}$/);
          const pages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.REUSE_RUN_ID}/jobs?per_page=100`], { encoding: 'utf8' }));
          const producer = pages.flatMap(page => page.jobs).find(job => job.name === `${process.env.BUILD_PLATFORM} (${process.env.BUILD_VARIANT})`);
          assert.ok(producer?.steps.some(step => step.name === 'Build installers' && step.conclusion === 'success'), 'Selected run did not produce these installers; select the original build run');
          const previous = JSON.parse(await fs.readFile(path.join(process.env.REUSE_DIRECTORY, 'target/identity-verification.json'), 'utf8').catch(error => {
            if (error.code === 'ENOENT') return '{}';
            throw error;
          }));
          if (previous.installerRunId != null) assert.equal(String(previous.installerRunId), process.env.REUSE_RUN_ID, 'Select the original installer-producing run, not a reuse run');
          if (previous.installerHeadSha != null) assert.equal(previous.installerHeadSha, run.head_sha, 'Installer provenance does not match the selected run');
          execFileSync('git', ['fetch', 'origin', run.head_sha], { stdio: 'inherit' });
          const changed = execFileSync('git', ['diff', '--name-only', run.head_sha, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const allowed = file => file.startsWith('.github/') || file.startsWith('docs/') || file === 'scripts/verify-installation.mjs' || /\.test\.(?:tsx?|mjs)$/.test(file);
          assert.ok(changed.every(allowed), `Installer build inputs changed: ${changed.filter(file => !allowed(file)).join(', ')}`);
          const recorded = JSON.parse(await fs.readFile(path.join(process.env.REUSE_DIRECTORY, 'src-tauri/gen/build-identity/identity.json'), 'utf8'));
          assert.deepEqual(recorded, resolveBuildIdentity());
          const bundle = path.join('target', process.env.BUILD_TARGET, 'release', 'bundle');
          await fs.mkdir(path.dirname(bundle), { recursive: true });
          await fs.cp(path.join(process.env.REUSE_DIRECTORY, bundle), bundle, { recursive: true });
          await fs.appendFile(process.env.GITHUB_ENV, `IDENTITY_INSTALLER_RUN_ID=${process.env.REUSE_RUN_ID}\nIDENTITY_INSTALLER_HEAD_SHA=${run.head_sha}\n`);
          JS
          node scripts/build.mjs --prepare-only --target ${{ matrix.target }}
          node scripts/prebuild.mjs ${{ matrix.target }}
      - name: Build installers
        if: inputs.reuse_run == ''
        shell: bash
        run: pnpm build --ci --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify Windows staged executable owners
        if: matrix.platform == 'windows'
        shell: bash
        run: cargo test --manifest-path node_modules/.verge/service-source/Cargo.toml --target-dir target/bundled-service --target ${{ matrix.target }} --features standalone,client --bin clash-verge-service-install newly_staged_core_and_service_have_a_trusted_installer_owner
      - name: Verify installed identity
        env:
          IDENTITY_APP_LOG_LEVEL: ${{ inputs.app_log_level }}
        shell: bash
        run: node scripts/verify-installation.mjs ${{ matrix.target }}
      - name: Print application diagnosis
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const root = 'target/identity-runtime-logs';
          for (const subdirectory of ['', 'before-cleanup', 'after-process-exit']) {
            const directory = path.join(root, subdirectory);
            const names = await fs.readdir(directory).catch(() => []);
            for (const name of names.filter(name => name.endsWith('.log'))) {
              console.log(`Application log: ${path.join(directory, name)}`);
              const lines = (await fs.readFile(path.join(directory, name), 'utf8')).split('\n').slice(-60);
              for (const line of lines) console.log(/token|secret|password|authorization/i.test(line) ? '[credential-related line omitted]' : line);
            }
          }
          JS
      - name: Upload runtime diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-diagnostics-${{ matrix.platform }}-${{ matrix.variant }}
          if-no-files-found: ignore
          path: |
            target/identity-verification.json
            target/identity-runtime-logs/**
      - name: Upload installers and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-identity-${{ matrix.platform }}-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/gen/build-identity/identity.json
            target/identity-verification.json
            target/identity-runtime-logs/**
            target/bundled-service/${{ matrix.target }}/release/service-integration-driver*
